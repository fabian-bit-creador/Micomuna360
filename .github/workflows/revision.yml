# Revisión automática: en cada pull request, en la rama de producción y en
# las ramas de propuesta corre ESLint, el build (que incluye la validación de
# todos los datos, src/lib/data-integrity.ts) y las pruebas de recorridos
# (e2e/). Si algo falla, el cambio queda marcado en rojo antes de que llegue
# al sitio.
name: Revisión

on:
  pull_request:
  push:
    branches:
      - claude/micomuna360-architecture-gadm7s
      - "propuesta-*"

concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  revision:
    name: Lint, datos, build y recorridos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build y validación de datos
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium

      - name: Pruebas de recorridos
        run: npm run test:e2e

      - name: Informe de las pruebas (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-recorridos
          path: playwright-report/
          retention-days: 14
